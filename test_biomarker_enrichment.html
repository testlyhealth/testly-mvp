<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomarker Enrichment Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .test-result {
            background: #e8f4f8;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
        }
        .error {
            background: #ffe8e8;
            color: #d32f2f;
        }
        .success {
            background: #e8f5e8;
            color: #2e7d32;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Biomarker Enrichment Test</h1>
    
    <div class="test-section">
        <h2>1. Test Biomarker Enrichment</h2>
        <button onclick="testBiomarkerEnrichment()">Test Enrichment</button>
        <div id="enrichmentResults"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Test Comparison Data</h2>
        <button onclick="testComparisonData()">Test Comparison</button>
        <div id="comparisonResults"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Test Specific Test</h2>
        <input type="text" id="testNameInput" placeholder="Enter test name" value="Testosterone Check">
        <button onclick="testSpecificTest()">Test Specific Test</button>
        <div id="specificTestResults"></div>
    </div>

    <script type="module">
        import { supabase } from './js/api/supabase.js';
        
        window.supabase = supabase;
        
        async function testBiomarkerEnrichment() {
            const resultsDiv = document.getElementById('enrichmentResults');
            resultsDiv.innerHTML = '<p>Testing biomarker enrichment...</p>';
            
            try {
                // Import the fetchAndEnrichTests function
                const { fetchAndEnrichTests } = await import('./js/general-health.js');
                
                console.log('Testing fetchAndEnrichTests function...');
                
                // Test with a small subset of tests
                const tests = await fetchAndEnrichTests({ categoryId: 3 });
                
                let html = `<h3>Enrichment Test Results</h3>`;
                html += `<p>Total tests enriched: ${tests.length}</p>`;
                
                // Check biomarker data for first few tests
                const sampleTests = tests.slice(0, 5);
                html += `<h4>Sample Tests:</h4>`;
                
                sampleTests.forEach((test, index) => {
                    const biomarkerCount = test.biomarker_count || 0;
                    const hasGroupedBiomarkers = test.grouped_biomarkers && Object.keys(test.grouped_biomarkers).length > 0;
                    const biomarkerNames = test.biomarker_names || [];
                    
                    html += `
                        <div class="test-result">
                            <h5>Test ${index + 1}: ${test.name}</h5>
                            <p><strong>Biomarker Count:</strong> ${biomarkerCount}</p>
                            <p><strong>Has Grouped Biomarkers:</strong> ${hasGroupedBiomarkers ? 'Yes' : 'No'}</p>
                            <p><strong>Biomarker Names:</strong> ${biomarkerNames.length} items</p>
                            <p><strong>Grouped Biomarkers:</strong></p>
                            <pre>${JSON.stringify(test.grouped_biomarkers, null, 2)}</pre>
                        </div>
                    `;
                });
                
                // Check for tests with 0 biomarkers
                const testsWithZeroBiomarkers = tests.filter(t => !t.biomarker_count || t.biomarker_count === 0);
                if (testsWithZeroBiomarkers.length > 0) {
                    html += `<h4>Tests with 0 Biomarkers (${testsWithZeroBiomarkers.length}):</h4>`;
                    html += `<ul>`;
                    testsWithZeroBiomarkers.slice(0, 10).forEach(test => {
                        html += `<li>${test.name} (ID: ${test.id})</li>`;
                    });
                    if (testsWithZeroBiomarkers.length > 10) {
                        html += `<li>... and ${testsWithZeroBiomarkers.length - 10} more</li>`;
                    }
                    html += `</ul>`;
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                console.error('Error in testBiomarkerEnrichment:', error);
            }
        }
        
        async function testComparisonData() {
            const resultsDiv = document.getElementById('comparisonResults');
            resultsDiv.innerHTML = '<p>Testing comparison data...</p>';
            
            try {
                // Get comparison tests from localStorage
                const comparisonTests = JSON.parse(localStorage.getItem('comparisonTests') || '[]');
                
                let html = `<h3>Comparison Data Test</h3>`;
                html += `<p>Tests in comparison: ${comparisonTests.length}</p>`;
                
                if (comparisonTests.length > 0) {
                    comparisonTests.forEach((test, index) => {
                        const biomarkerCount = test.biomarker_count || 0;
                        const hasGroupedBiomarkers = test.grouped_biomarkers && Object.keys(test.grouped_biomarkers).length > 0;
                        const biomarkerNames = test.biomarker_names || [];
                        
                        html += `
                            <div class="test-result">
                                <h5>Comparison Test ${index + 1}: ${test.name}</h5>
                                <p><strong>Biomarker Count:</strong> ${biomarkerCount}</p>
                                <p><strong>Has Grouped Biomarkers:</strong> ${hasGroupedBiomarkers ? 'Yes' : 'No'}</p>
                                <p><strong>Biomarker Names:</strong> ${biomarkerNames.length} items</p>
                                <p><strong>Grouped Biomarkers:</strong></p>
                                <pre>${JSON.stringify(test.grouped_biomarkers, null, 2)}</pre>
                            </div>
                        `;
                    });
                } else {
                    html += `<p>No tests in comparison</p>`;
                }
                
                // Check global tests
                if (window._allGeneralHealthTests) {
                    html += `<h4>Global Tests (${window._allGeneralHealthTests.length}):</h4>`;
                    const globalTestsWithBiomarkers = window._allGeneralHealthTests.filter(t => t.biomarker_count > 0);
                    html += `<p>Global tests with biomarkers: ${globalTestsWithBiomarkers.length}</p>`;
                    
                    if (globalTestsWithBiomarkers.length > 0) {
                        html += `<h5>Sample Global Tests with Biomarkers:</h5>`;
                        globalTestsWithBiomarkers.slice(0, 3).forEach(test => {
                            html += `<p>${test.name}: ${test.biomarker_count} biomarkers</p>`;
                        });
                    }
                } else {
                    html += `<p>No global tests available</p>`;
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                console.error('Error in testComparisonData:', error);
            }
        }
        
        async function testSpecificTest() {
            const testName = document.getElementById('testNameInput').value;
            const resultsDiv = document.getElementById('specificTestResults');
            resultsDiv.innerHTML = '<p>Testing specific test...</p>';
            
            try {
                // Find the test in global tests
                let test = null;
                if (window._allGeneralHealthTests) {
                    test = window._allGeneralHealthTests.find(t => t.name.toLowerCase().includes(testName.toLowerCase()));
                }
                
                if (!test) {
                    resultsDiv.innerHTML = `<div class="error">Test "${testName}" not found in global tests</div>`;
                    return;
                }
                
                let html = `<h3>Specific Test Results</h3>`;
                html += `<h4>Test: ${test.name}</h4>`;
                html += `<p><strong>ID:</strong> ${test.id}</p>`;
                html += `<p><strong>Provider:</strong> ${test.provider?.name || test.provider}</p>`;
                html += `<p><strong>Biomarker Count:</strong> ${test.biomarker_count || 0}</p>`;
                html += `<p><strong>Biomarker Names:</strong> ${(test.biomarker_names || []).length} items</p>`;
                html += `<p><strong>Grouped Biomarkers:</strong></p>`;
                html += `<pre>${JSON.stringify(test.grouped_biomarkers, null, 2)}</pre>`;
                
                // Test the biomarker generation functions
                const { CardService } = await import('./js/services/cardService.js');
                
                html += `<h4>Biomarker HTML Generation:</h4>`;
                const biomarkerHTML = await CardService.generateBiomarkerHTML(test);
                html += `<div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">${biomarkerHTML}</div>`;
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                console.error('Error in testSpecificTest:', error);
            }
        }
        
        // Make functions globally available
        window.testBiomarkerEnrichment = testBiomarkerEnrichment;
        window.testComparisonData = testComparisonData;
        window.testSpecificTest = testSpecificTest;
    </script>
</body>
</html>
