<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomarker Search Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .debug-section {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .test-result {
            background: #e8f4f8;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
        }
        .error {
            background: #ffe8e8;
            color: #d32f2f;
        }
        .success {
            background: #e8f5e8;
            color: #2e7d32;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        input, select {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>Biomarker Search Debug Tool</h1>
    
    <div class="debug-section">
        <h2>1. Test Biomarker Search</h2>
        <input type="text" id="biomarkerSearch" placeholder="Enter biomarker name (e.g., testosterone)" value="testosterone">
        <button onclick="testBiomarkerSearch()">Search</button>
        <div id="searchResults"></div>
    </div>
    
    <div class="debug-section">
        <h2>2. Check Database State</h2>
        <button onclick="checkDatabaseState()">Check Database</button>
        <div id="databaseResults"></div>
    </div>
    
    <div class="debug-section">
        <h2>3. Test Specific Tests</h2>
        <select id="testSelect">
            <option value="">Select a test...</option>
        </select>
        <button onclick="testSpecificTest()">Check Test</button>
        <div id="testResults"></div>
    </div>
    
    <div class="debug-section">
        <h2>4. Run Full Debug</h2>
        <button onclick="runFullDebug()">Run Full Debug</button>
        <div id="fullDebugResults"></div>
    </div>

    <script type="module">
        import { supabase } from './js/api/supabase.js';
        
        window.supabase = supabase;
        
        async function testBiomarkerSearch() {
            const searchTerm = document.getElementById('biomarkerSearch').value;
            const resultsDiv = document.getElementById('searchResults');
            
            resultsDiv.innerHTML = '<p>Searching...</p>';
            
            try {
                // 1. Check if biomarker exists
                const { data: biomarkers, error: biomarkerError } = await supabase
                    .from('biomarkers')
                    .select('id, name')
                    .ilike('name', `%${searchTerm}%`);
                
                if (biomarkerError) {
                    resultsDiv.innerHTML = `<div class="error">Error fetching biomarkers: ${biomarkerError.message}</div>`;
                    return;
                }
                
                let html = `<h3>Biomarkers found: ${biomarkers.length}</h3>`;
                
                if (biomarkers.length === 0) {
                    html += '<div class="error">No biomarkers found with that name!</div>';
                } else {
                    html += '<ul>';
                    biomarkers.forEach(bio => {
                        html += `<li><strong>${bio.name}</strong> (ID: ${bio.id})</li>`;
                    });
                    html += '</ul>';
                    
                    // 2. Check which tests have this biomarker
                    const biomarkerIds = biomarkers.map(b => b.id);
                    const { data: links, error: linkError } = await supabase
                        .from('biomarker_link_table')
                        .select('provider_blood_test_id, biomarker_id')
                        .in('biomarker_id', biomarkerIds);
                    
                    if (linkError) {
                        html += `<div class="error">Error fetching links: ${linkError.message}</div>`;
                    } else {
                        html += `<h3>Tests with this biomarker: ${links.length}</h3>`;
                        
                        if (links.length > 0) {
                            const testIds = [...new Set(links.map(l => l.provider_blood_test_id))];
                            const { data: tests, error: testError } = await supabase
                                .from('provider_blood_tests')
                                .select('id, name, provider_id, providers(name)')
                                .in('id', testIds);
                            
                            if (testError) {
                                html += `<div class="error">Error fetching tests: ${testError.message}</div>`;
                            } else {
                                html += '<ul>';
                                tests.forEach(test => {
                                    html += `<li><strong>${test.name}</strong> (Provider: ${test.providers?.name || 'Unknown'})</li>`;
                                });
                                html += '</ul>';
                            }
                        }
                    }
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function checkDatabaseState() {
            const resultsDiv = document.getElementById('databaseResults');
            resultsDiv.innerHTML = '<p>Checking database...</p>';
            
            try {
                // Check total counts
                const { count: biomarkerCount } = await supabase
                    .from('biomarkers')
                    .select('*', { count: 'exact', head: true });
                
                const { count: testCount } = await supabase
                    .from('provider_blood_tests')
                    .select('*', { count: 'exact', head: true });
                
                const { count: linkCount } = await supabase
                    .from('biomarker_link_table')
                    .select('*', { count: 'exact', head: true });
                
                let html = `
                    <h3>Database Summary</h3>
                    <ul>
                        <li>Total biomarkers: ${biomarkerCount}</li>
                        <li>Total tests: ${testCount}</li>
                        <li>Total biomarker links: ${linkCount}</li>
                    </ul>
                `;
                
                // Check for common issues
                const { data: testsWithoutLinks, error: noLinksError } = await supabase
                    .from('provider_blood_tests')
                    .select('id, name')
                    .not('id', 'in', `(select provider_blood_test_id from biomarker_link_table)`);
                
                if (!noLinksError && testsWithoutLinks.length > 0) {
                    html += `<h3>Tests without any biomarker links: ${testsWithoutLinks.length}</h3>`;
                    html += '<ul>';
                    testsWithoutLinks.slice(0, 10).forEach(test => {
                        html += `<li>${test.name} (ID: ${test.id})</li>`;
                    });
                    if (testsWithoutLinks.length > 10) {
                        html += `<li>... and ${testsWithoutLinks.length - 10} more</li>`;
                    }
                    html += '</ul>';
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testSpecificTest() {
            const testId = document.getElementById('testSelect').value;
            if (!testId) {
                alert('Please select a test first');
                return;
            }
            
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<p>Checking test...</p>';
            
            try {
                // Get test details
                const { data: test, error: testError } = await supabase
                    .from('provider_blood_tests')
                    .select('id, name, provider_id, providers(name)')
                    .eq('id', testId)
                    .single();
                
                if (testError) {
                    resultsDiv.innerHTML = `<div class="error">Error fetching test: ${testError.message}</div>`;
                    return;
                }
                
                // Get biomarker links for this test
                const { data: links, error: linkError } = await supabase
                    .from('biomarker_link_table')
                    .select('biomarker_id')
                    .eq('provider_blood_test_id', testId);
                
                if (linkError) {
                    resultsDiv.innerHTML = `<div class="error">Error fetching links: ${linkError.message}</div>`;
                    return;
                }
                
                let html = `
                    <h3>Test Details</h3>
                    <p><strong>Name:</strong> ${test.name}</p>
                    <p><strong>ID:</strong> ${test.id}</p>
                    <p><strong>Provider:</strong> ${test.providers?.name || 'Unknown'}</p>
                    <p><strong>Biomarker links:</strong> ${links.length}</p>
                `;
                
                if (links.length > 0) {
                    const biomarkerIds = links.map(l => l.biomarker_id);
                    const { data: biomarkers, error: bioError } = await supabase
                        .from('biomarkers')
                        .select('id, name')
                        .in('id', biomarkerIds);
                    
                    if (bioError) {
                        html += `<div class="error">Error fetching biomarkers: ${bioError.message}</div>`;
                    } else {
                        html += '<h4>Biomarkers:</h4><ul>';
                        biomarkers.forEach(bio => {
                            html += `<li>${bio.name} (ID: ${bio.id})</li>`;
                        });
                        html += '</ul>';
                    }
                } else {
                    html += '<div class="error">No biomarker links found for this test!</div>';
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function runFullDebug() {
            const resultsDiv = document.getElementById('fullDebugResults');
            resultsDiv.innerHTML = '<p>Running full debug...</p>';
            
            try {
                let html = '<h3>Full Debug Results</h3>';
                
                // 1. Check testosterone specifically
                const { data: testosterone, error: testError } = await supabase
                    .from('biomarkers')
                    .select('id, name')
                    .ilike('name', '%testosterone%');
                
                html += `<h4>1. Testosterone biomarkers found: ${testosterone.length}</h4>`;
                if (testosterone.length > 0) {
                    html += '<ul>';
                    testosterone.forEach(t => html += `<li>${t.name} (ID: ${t.id})</li>`);
                    html += '</ul>';
                    
                    // Check which tests have testosterone
                    const testIds = testosterone.map(t => t.id);
                    const { data: testLinks, error: linkError } = await supabase
                        .from('biomarker_link_table')
                        .select('provider_blood_test_id, biomarker_id')
                        .in('biomarker_id', testIds);
                    
                    if (!linkError) {
                        const uniqueTestIds = [...new Set(testLinks.map(l => l.provider_blood_test_id))];
                        html += `<h4>2. Tests with testosterone: ${uniqueTestIds.length}</h4>`;
                        
                        // Check which are in men's health category
                        const { data: categoryLinks, error: catError } = await supabase
                            .from('blood_test_category_link_table')
                            .select('provider_blood_test_id')
                            .eq('blood_test_category_id', 3)
                            .in('provider_blood_test_id', uniqueTestIds);
                        
                        if (!catError) {
                            const categoryTestIds = categoryLinks.map(l => l.provider_blood_test_id);
                            html += `<h4>3. Tests with testosterone in men's health category: ${categoryTestIds.length}</h4>`;
                            
                            if (categoryTestIds.length > 0) {
                                const { data: categoryTests, error: catTestError } = await supabase
                                    .from('provider_blood_tests')
                                    .select('id, name, providers(name)')
                                    .in('id', categoryTestIds);
                                
                                if (!catTestError) {
                                    html += '<ul>';
                                    categoryTests.forEach(test => {
                                        html += `<li>${test.name} (Provider: ${test.providers?.name || 'Unknown'})</li>`;
                                    });
                                    html += '</ul>';
                                }
                            }
                        }
                    }
                } else {
                    html += '<div class="error">No testosterone biomarkers found!</div>';
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        // Load test options
        async function loadTestOptions() {
            try {
                const { data: tests, error } = await supabase
                    .from('provider_blood_tests')
                    .select('id, name')
                    .limit(50);
                
                if (!error && tests) {
                    const select = document.getElementById('testSelect');
                    tests.forEach(test => {
                        const option = document.createElement('option');
                        option.value = test.id;
                        option.textContent = test.name;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading test options:', error);
            }
        }
        
        // Initialize
        loadTestOptions();
        
        // Make functions globally available
        window.testBiomarkerSearch = testBiomarkerSearch;
        window.checkDatabaseState = checkDatabaseState;
        window.testSpecificTest = testSpecificTest;
        window.runFullDebug = runFullDebug;
    </script>
</body>
</html>
